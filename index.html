<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App de San Valentín</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #ffe6e6;
            padding: 50px;
        }
        #buttons {
            margin: 20px;
        }
        button {
            margin: 10px;
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        #yes {
            background-color: #ff69b4;
            color: white;
            border: none;
            border-radius: 5px;
        }
        #no {
            background-color: #ccc;
            color: black;
            border: none;
            border-radius: 5px;
        }
        #invitation {
            display: none;
            margin-top: 20px;
            font-size: 18px;
            color: #d63384;
        }
    </style>
</head>
<body>
    <h1>¿Quieres ser mi San Valentín?</h1>
    <div id="buttons">
        <button id="yes">Sí</button>
        <button id="no">No</button>
    </div>
    <div id="invitation">
        ¡Feliz San Valentín! Cita el 22 de febrero a las 21:00 horas en la casa de Nachini. Te amo ❤️
    </div>

    <script>
        let yesSize = 1;
        const yesButton = document.getElementById('yes');
        const noButton = document.getElementById('no');
        const invitation = document.getElementById('invitation');

        noButton.addEventListener('click', () => {
            yesSize += 0.5;
            yesButton.style.transform = `scale(${yesSize})`;
            yesButton.style.fontSize = `${16 * yesSize}px`;
            yesButton.style.padding = `${10 * yesSize}px ${20 * yesSize}px`;
        });

        yesButton.addEventListener('click', () => {
            document.getElementById('buttons').style.display = 'none';
            invitation.style.display = 'block';
        });
    </script>
</body>
</html>
